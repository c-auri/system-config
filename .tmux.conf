set -g default-terminal "tmux-256color"

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

# when the current session is closed, switch to another session instead of detaching
set -g detach-on-destroy off

# home is shown through tmux-open-home, which gives each terminal its own grouped view of
# it, so two terminals don't have to show the same window

# a client that switches to home while another one shows it gets its own view instead
set-hook -g client-session-changed \
  "if -F \"#{&&:#{==:#{session_name},home},#{>:#{session_attached},1}}\" \
    \"run-shell \\\"~/.local/bin/tmux-open-home '#{client_name}'\\\"\""

# kill the current session and switch to home, creating home if it doesn't exist; in home
# or one of its views, only kill that session, like a plain kill-session would
bind X confirm-before -p "kill-session #S? (y/n)" \
  "run-shell \" \
    [ '#{||:#{==:#{session_name},home},#{==:#{session_group},home}}' = 1 ] || \
      ~/.local/bin/tmux-open-home '#{client_name}'; \
    tmux kill-session -t '#{session_id}' \
  \""

# prompt for a name, then create that session and switch to it (or switch to it if it
# exists); without a name, the session gets a number like a plain new-session would.
# %1 instead of %%, since only the first %% is replaced. The nested escapes keep the
# quotes around the name, which the brace syntax drops in tmux 3.2a.
bind N command-prompt -p "new session:" \
  "if -F \"#{==:%1,}\" \
    \"new-session -c \\\"#{pane_current_path}\\\"\" \
    \"new-session -A -s \\\"%1\\\" -c \\\"#{pane_current_path}\\\"\""

# toggle home: from any other session go to home (creating it if needed),
# from home or one of its grouped views go back to the previous session
bind H if -F "#{||:#{==:#{session_name},home},#{==:#{session_group},home}}" \
  "switch-client -l" \
  "run-shell \"~/.local/bin/tmux-open-home '#{client_name}'\""

set-window-option -g mode-keys vi

set -g mouse on

# make v start a charwise selection, to match vim's keybindings
bind -T copy-mode-vi v send -X begin-selection

# Dedent on copy so common indents are ignored. See ~/.local/share/tmux/dedent.awk
DEDENT='$HOME/.local/share/tmux/dedent.awk | tmux load-buffer -w -'
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi C-j   send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "#{DEDENT}"
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "#{DEDENT}"
