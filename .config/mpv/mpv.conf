loop-playlist=inf
keep-open=yes
volume=42

# Resume playback only for the video collections under ~/videos.
# Off by default, switched on by the [videos] profile below.
save-position-on-quit=no
resume-playback=no

[videos]
profile-cond=(path:sub(1,1) == "/" and path or (working_directory .. "/" .. path)):find("/home/cauri/videos/", 1, true) == 1
save-position-on-quit=yes
resume-playback=yes
